name: CI

# Когда запускаем: на каждый PR в main и на каждый push в main (то есть после слияния PR).
# Фильтров по путям нет: приложение одно, а пропущенная проверка блокировала бы
# слияние, когда main защищена обязательными проверками.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Новый пуш в тот же PR отменяет устаревший прогон. Для main не отменяем:
# сборка и публикация образа не должны обрываться на середине.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Права GITHUB_TOKEN по умолчанию: только чтение кода. Всё остальное обнуляется.
# Что-то большее выдаём конкретному job'у (см. build).
permissions:
  contents: read

env:
  # Имя образа в GHCR: ghcr.io/xl33zy/homelab-platform/notes (репозиторий/сервис).
  IMAGE_NAME: ghcr.io/${{ github.repository }}/notes

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # токен после checkout дальше не нужен

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/requirements.txt
            apps/requirements-dev.txt

      - name: Установить зависимости
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      # Версия Hadolint закреплена внутри самого action (образ с digest в его Dockerfile),
      # поэтому закрепление action на SHA закрепляет и Hadolint.
      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: apps/Dockerfile

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps

    # Одноразовый PostgreSQL рядом с job'ом, та же версия, что в compose.yaml.
    # -h 127.0.0.1 в health-cmd: на время инициализации образ слушает только
    # unix-сокет (как мы уже видели в compose), без -h проверка прошла бы раньше времени.
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_PASSWORD: test # одноразовая БД внутри job'а, не секрет
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Те же переменные PG*, которые читает приложение (и которые мы задаём локально).
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: test
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/requirements.txt
            apps/requirements-dev.txt

      - name: Установить зависимости
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: pytest
        run: pytest -q

  build:
    name: build
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Только здесь нужна запись в реестр образов (packages: write).
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Логин в реестр нужен только для публикации, то есть только на push в main.
      - name: Логин в GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Теги и метки образа. Тег один: sha-<7 символов коммита> (без latest).
      - name: Метаданные образа
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: type=sha
          flavor: latest=false

      # На PR образ только собирается (проверка, что Dockerfile не сломан),
      # на push в main собирается и публикуется.
      - name: Сборка (и публикация на main)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps
          file: apps/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
