name: notes

x-db-env: &db-env
  PGHOST: db
  PGUSER: notes
  PGDATABASE: notes
  PGPASSWORD: ${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD в файле .env (см. .env.example)}

services:
  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: notes
      POSTGRES_DB: notes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD в файле .env (см. .env.example)}
    volumes:
      - db-data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U notes -d notes"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build: .
    image: notes-api:local
    environment:
      <<: *db-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  cleanup:
    image: notes-api:local
    command: ["python", "cleanup.py"]
    environment:
      <<: *db-env
      NOTES_RETENTION_DAYS: "30"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  db-data:
